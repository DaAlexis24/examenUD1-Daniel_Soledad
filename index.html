<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Encuesta de satisfacción al usuario" />
    <meta
      name="keywords"
      content="componentes, calificación, encuesta, satisfacción"
    />
    <meta name="author" content="DS Components" />
    <link
      rel="shortcut icon"
      href="/assets/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/main.css" />
    <title>DS Components - Encuesta de Calificación</title>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="../assets/icon-star.svg" alt="logo-principal" />
      </div>
      <div class="survey-container">
        <h1>¿Cómo lo hicimos?</h1>
        <p>
          Por favor, haznos saber cómo lo hicimos con tu solicitud de soporte.
        </p>
        <p>
          Todos los comentarios son bienvenidos para ayudarnos a mejorar nuestra
          oferta!
        </p>
      </div>
      <div class="choices-container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
      </div>
      <div class="button-container">
        <button type="submit">ENVIAR</button>
      </div>
    </div>
  </body>
</html>
